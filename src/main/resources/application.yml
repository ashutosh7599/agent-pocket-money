spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/main_db}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
otel:
  service:
    name: agent-wallet
  logs:
    exporter: otlp
  traces:
    exporter: otlp
  metrics:
    exporter: none
  exporter:
    otlp:
      protocol: http/protobuf
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  instrumentation:
    logback-appender:
      enabled: true
logging:
  level:
    root: WARN
    com.agentpocketmoney.agentwallet: INFO
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
